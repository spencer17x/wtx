name: Release Dry Run

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to validate
        required: true
        default: v0.0.0

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag }}
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate tag and derive package version
        id: version
        run: |
          VERSION="$(node -e "const { getVersionFromTag } = require('./npm/platform'); process.stdout.write(getVersionFromTag(process.env.RELEASE_TAG));")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        env:
          RELEASE_TAG: ${{ inputs.tag }}
      - name: Derive package version
        run: |
          node -e "const fs=require('fs');const pkg=require('./package.json');pkg.version=process.env.VERSION;fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');"
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - name: Dry-run package publish shape
        run: npm pack --dry-run
      - name: Run tests
        run: npm test
      - name: Run release snapshot
        run: npm run release:snapshot
