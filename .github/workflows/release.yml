name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Derive package version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs');const pkg=require('./package.json');pkg.version='${VERSION}';fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');"
      - run: npm test
      - run: npm run release:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          URL="https://github.com/spencer17x/wtx/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          SHA256="$(curl -fsSL "$URL" | shasum -a 256 | awk '{print $1}')"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/spencer17x/homebrew-wtx.git" /tmp/homebrew-wtx
          node scripts/update-homebrew-formula.js \
            packaging/homebrew/wtx.rb.tmpl \
            /tmp/homebrew-wtx/Formula/wtx.rb \
            "${VERSION}" \
            "${SHA256}" \
            "${URL}"
          cd /tmp/homebrew-wtx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/wtx.rb
          git commit -m "wtx ${VERSION}"
          git push
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
