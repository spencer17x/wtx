name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Validate tag and derive package version
        id: version
        run: |
          VERSION="$(node -e "const { getVersionFromTag } = require('./npm/platform'); process.stdout.write(getVersionFromTag(process.env.RELEASE_TAG));")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Derive package version
        run: |
          node -e "const fs=require('fs');const pkg=require('./package.json');pkg.version=process.env.VERSION;fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');"
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - name: Run tests
        run: npm test
      - name: Check for complete GitHub release assets
        id: release_state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          RELEASE_JSON_PATH="$(mktemp)"
          status="$(curl -sS -o "$RELEASE_JSON_PATH" -w '%{http_code}' \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          if [ "$status" = "200" ]; then
            node scripts/check-release-assets.js "$RELEASE_JSON_PATH"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" = "404" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected GitHub release lookup status: $status" >&2
            cat "$RELEASE_JSON_PATH" >&2
            exit 1
          fi
      - name: Publish GitHub release
        if: steps.release_state.outputs.exists != 'true'
        run: npm run release:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve package name
        id: package_name
        run: |
          echo "name=$(node -e "process.stdout.write(require('./package.json').name)")" >> "$GITHUB_OUTPUT"
      - name: Check if npm version is already published
        id: npm_exists
        env:
          PACKAGE_NAME: ${{ steps.package_name.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "${PACKAGE_NAME}@${VERSION}" version --json >/tmp/npm-version.json 2>/tmp/npm-version.err; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            if grep -Eq '(^|[[:space:]])(E404|404 Not Found|code E404)([[:space:]]|$)' /tmp/npm-version.err; then
              echo "exists=false" >> "$GITHUB_OUTPUT"
            else
              echo "Unexpected npm registry lookup failure:" >&2
              cat /tmp/npm-version.err >&2
              exit 1
            fi
          fi
      - name: Publish npm package
        if: steps.npm_exists.outputs.exists != 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
